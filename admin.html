<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<style>
:root{
  --primary:#145A32;--bg:#F6F6F6;--surface:#FFFFFF;--line:#E2E8D9;--muted:#6B7280;
  --accent:#145A32;--accentText:#FFFFFF;--success:#18A957;--radius:16px;
  --shadow:0 1px 2px rgba(10,10,10,.06),0 8px 24px rgba(10,10,10,.05);
  --shadow-sm:0 1px 3px rgba(10,10,10,.08);
  --safe:env(safe-area-inset-bottom,0px);
  --accentLight:#d9ede0;--accentDark:#0d3d22;
}
*{box-sizing:border-box}
*{min-width:0}
body,h1,h2,h3,h4,h5,h6,p,span,div,a,button,input,select,textarea,td,th,label{overflow-wrap:break-word;word-break:normal}
.chip,.tag,.badge,.btn,button{max-width:100%;white-space:normal}
img{max-width:100%;height:auto}
table{table-layout:auto;width:100%;border-collapse:collapse}
td,th{white-space:nowrap}
html,body{height:100%}
body{margin:0;background:var(--bg);color:#111;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.4;font-size:14px}
img{max-width:100%;display:block}
button{font:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
.topbar{position:sticky;top:0;z-index:20;background:#fff;backdrop-filter:saturate(120%) blur(6px);border-bottom:1px solid var(--line)}
.topbar-inner{height:56px;display:flex;align-items:center;gap:10px;padding:0 16px;max-width:1100px;margin:0 auto}
.topbar-logo{height:36px;width:auto;border-radius:8px;flex-shrink:0}
.title{font-family:Poppins,sans-serif;font-size:20px;font-weight:700;margin:0;color:var(--accentDark);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-round{width:36px;height:36px;border-radius:999px;border:1px solid var(--line);background:#fff;display:inline-grid;place-items:center;color:#111;box-shadow:var(--shadow-sm)}
.admin-wrap{max-width:1100px;margin:0 auto;padding:16px;padding-bottom:120px}
.admin-card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px;margin-bottom:16px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font-weight:700;border:none;border-radius:14px;padding:12px 16px;background:var(--accent);color:var(--accentText);font-size:14px;transition:background .2s}
.btn:hover{background:var(--accentDark)}
.btn:active{transform:translateY(1px)}
.btn-outline{background:#fff;color:#111;border:1px solid var(--line)}
.btn-outline:hover{background:var(--accentLight);border-color:var(--accent)}
.btn-block{width:100%}
.btn-sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn-danger{background:#E11D48;color:#fff;border:1px solid #E11D48}
.btn-danger:hover{background:#be123c}
.btn-success{background:var(--success);color:#fff;border:1px solid var(--success)}
.muted{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px}
input,textarea,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;font:inherit;font-size:14px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,191,92,.15)}
textarea{min-height:80px;resize:vertical}
label{font-size:13px;color:#111;margin:8px 0 4px;display:block;font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px}
.sep{height:1px;background:var(--line);margin:10px 0}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th,.table td{border-bottom:1px solid var(--line);padding:10px;text-align:left;vertical-align:top}
.table th{background:var(--accentLight);font-weight:700;color:var(--accentDark);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.dropzone{border:2px dashed var(--accent);border-radius:14px;padding:18px;text-align:center;background:var(--accentLight);color:var(--accentDark);cursor:pointer;transition:background .2s}
.dropzone:hover{background:#d4edca}
.thumbs{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.thumb{width:72px;height:72px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover}
.review-stars{color:#FFD700;font-size:14px}
.review-stars .empty{color:#ddd}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--accentDark);color:#fff;padding:10px 14px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
.toast.show{opacity:1}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.stat-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center;box-shadow:var(--shadow-sm)}
.stat-card .stat-num{font-size:28px;font-weight:700;font-family:Poppins;color:var(--accent)}
.stat-card .stat-label{font-size:12px;color:var(--muted);margin-top:4px}
.order-detail-card{background:var(--accentLight);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:10px}
.order-detail-card h4{margin:0 0 8px;font-family:Poppins;font-size:14px;color:var(--accentDark)}
.map-container{width:100%;height:200px;border-radius:12px;overflow:hidden;border:1px solid var(--line);margin-top:8px}
#admin-view{display:none}
.nav-grid{display:grid;gap:10px;grid-template-columns:1fr 1fr}
@media(min-width:600px){.nav-grid{grid-template-columns:repeat(4,1fr)}}
.nav-card{display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px;border:1px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;transition:box-shadow .2s,transform .2s;text-align:center}
.nav-card:hover{box-shadow:var(--shadow);transform:translateY(-2px);border-color:var(--accent)}
.nav-card i{font-size:28px;color:var(--accent)}
.nav-card span{font-weight:600;font-size:13px}
.del-status-chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600}
.del-status-chip.unassigned{background:#FFF7E6;color:#D97706;border:1px solid #FFE0A3}
.del-status-chip.accepted{background:#E0F2FE;color:#0284C7;border:1px solid #BAE6FD}
.del-status-chip.preparing{background:#FEF3C7;color:#B45309;border:1px solid #FDE68A}
.del-status-chip.ready{background:#EDE9FE;color:#6D28D9;border:1px solid #DDD6FE}
.del-status-chip.picked{background:#F3E8FF;color:#7C3AED;border:1px solid #DDD6FE}
.del-status-chip.ontheway{background:#DBEAFE;color:#1D4ED8;border:1px solid #BFDBFE}
.del-status-chip.delivered{background:#E6F7EE;color:#18A957;border:1px solid #CFF7DF}
.new-order-modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9998;display:none;align-items:center;justify-content:center}
.new-order-modal-backdrop.open{display:flex}
.new-order-modal{background:#fff;border-radius:22px;max-width:480px;width:92%;max-height:88vh;overflow-y:auto;margin:20px}
@keyframes ringPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.ring-pulse{animation:ringPulse 1s ease-in-out infinite}
.stage-btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.earning-box{background:var(--accentLight);border:1px solid var(--accent);border-radius:10px;padding:12px;text-align:center;}
.earning-box .amt{font-size:22px;font-weight:bold;color:var(--accentDark);font-family:Poppins}
.earning-box .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px}
.payout-preset{cursor:pointer;transition:all 0.2s;}
.payout-preset:hover{background:var(--accent);color:#fff;border-color:var(--accent);}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <button id="admin-back" class="icon-round" aria-label="Back" style="display:none" onclick="adminGoBack()"><i class="fa-solid fa-arrow-left"></i></button>
    <button id="admin-home" class="icon-round" aria-label="Home" style="display:none" onclick="routeTo('#/dashboard')"><i class="fa-solid fa-house"></i></button>
    <img id="admin-logo" class="topbar-logo" src="" alt="Zesto" style="display:none">
    <h1 id="admin-title" class="title"><i class="fa-solid fa-shield-halved" style="color:var(--accent)"></i> Admin Panel</h1>
    <div style="margin-left:auto;display:flex;gap:8px">
      <button class="btn btn-outline btn-sm" id="admin-logout" style="display:none"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
    </div>
  </div>
</header>

<div class="admin-wrap">
  <div id="admin-login" class="admin-card" style="max-width:480px;margin:40px auto">
    <div style="text-align:center;margin-bottom:16px">
      <div style="width:64px;height:64px;border-radius:999px;background:var(--accentLight);display:grid;place-items:center;margin:0 auto 10px"><i class="fa-solid fa-lock" style="font-size:28px;color:var(--accent)"></i></div>
      <h2 style="margin:0;font-family:Poppins;color:var(--accentDark)">Admin Login</h2>
    </div>
    <form id="admin-login-form" autocomplete="off">
      <label>Admin ID</label><input id="adm-id" type="text" placeholder="Admin ID" required>
      <label>Password</label><input id="adm-pw" type="password" placeholder="Password" required>
      <div style="margin-top:14px"><button class="btn btn-block" type="submit"><i class="fa-solid fa-arrow-right-to-bracket"></i> Login</button></div>
    </form>
  </div>
  <div id="admin-view"></div>
</div>

<div id="new-order-modal-backdrop" class="new-order-modal-backdrop">
  <div class="new-order-modal" id="new-order-modal-body"></div>
</div>

<div id="toast" class="toast"></div>

<script>
const ADMIN_ID="Madhav@store";const ADMIN_PW="Madhav@Sharma123";
const $=s=>document.querySelector(s);const $$=s=>Array.from(document.querySelectorAll(s));
const money=n=>'\u20B9'+(n||0).toLocaleString("en-IN");
const uid=()=>'p_'+Math.random().toString(36).slice(2)+Date.now().toString(36);
const escapeHtml=(s="")=>s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const toast=msg=>{const t=$("#toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800)};
const routeTo=hash=>{location.hash=hash};
function renderStarIcons(r,max=5){let h='';for(let i=1;i<=max;i++)h+=i<=r?'<i class="fa-solid fa-star"></i>':'<i class="fa-solid fa-star empty"></i>';return h}

if(location.hash&&location.hash!=="#/dashboard"&&location.hash!=="#/"){
  history.replaceState(null,"",location.pathname+location.search+"#/dashboard");
}

let PRODUCTS=[],ORDERS=[],CUSTOMERS=[],RATINGS=[],DELIVERY_APPS=[],CATEGORIES=[],OFFERS=[];
let HERO_IMAGE_URL="",BANNER_TEXT="",APP_LOGO_URL="";
let CONFIG={};
let IS_AUTHED=sessionStorage.getItem("sf_admin_auth")==="1";
let ADMIN_NAV_STACK=[location.hash||"#/dashboard"];
let _adminBackNav=false;
function adminGoBack(){
  if(ADMIN_NAV_STACK.length<=1){routeTo("#/dashboard");return}
  ADMIN_NAV_STACK.pop();
  const prev=ADMIN_NAV_STACK[ADMIN_NAV_STACK.length-1];
  _adminBackNav=true;
  if(location.hash===prev)render();else location.hash=prev;
}

var productsRef=db.ref('products');var ordersRef=db.ref('orders');var ratingsRef=db.ref('ratings');var categoriesRef=db.ref('categories');
var offersRef=db.ref('offers');var usersRef=db.ref('users');
var milestonesRef=db.ref('milestones');var rewardsRef=db.ref('rewards');
let LOYALTY_CARD_SETTINGS={enabled:true,title:"Loyalty Rewards",backgroundImage:"",rewardImage:""};
var loyaltyCardSettingsRef=db.ref('loyaltyCardSettings');
loyaltyCardSettingsRef.on('value',s=>{LOYALTY_CARD_SETTINGS=Object.assign({enabled:true,title:"Loyalty Rewards",backgroundImage:"",rewardImage:""},s.val()||{});if(LOYALTY_TAB==='card')tryRender()});
var referralCampaignsRef=db.ref('referralCampaigns');var referralsRef=db.ref('referrals');var referralSettingsRef=db.ref('referralSettings');
var vendorsRef=db.ref('vendors');var vendorPlansRef=db.ref('vendorPlans');var vendorHelpVideosRef=db.ref('vendorHelpVideos');var vendorSettingsRef=db.ref('vendorSettings');
let VENDORS_ALL=[],VENDOR_PLANS=[],VENDOR_HELP_VIDEOS=[],VENDOR_SETTINGS={maxPrepMinutes:120};
vendorsRef.on('value',s=>{const v=s.val();VENDORS_ALL=v?Object.keys(v).map(k=>({uid:k,...v[k]})):[];tryRender()});
vendorPlansRef.on('value',s=>{const v=s.val();VENDOR_PLANS=v?Object.keys(v).map(k=>({id:k,...v[k]})):[];tryRender()});
vendorHelpVideosRef.on('value',s=>{const v=s.val();VENDOR_HELP_VIDEOS=v?Object.keys(v).map(k=>({id:k,...v[k]})):[];tryRender()});
vendorSettingsRef.on('value',s=>{VENDOR_SETTINGS=s.val()||{maxPrepMinutes:120};tryRender()});
let REFERRAL_CAMPAIGNS=[],REFERRALS_ALL=[],REFERRAL_SETTINGS={enabled:true};
referralCampaignsRef.on('value',s=>{const v=s.val();REFERRAL_CAMPAIGNS=v?Object.keys(v).map(k=>({id:k,...v[k]})):[];tryRender()});
referralsRef.on('value',s=>{const v=s.val();REFERRALS_ALL=v?Object.keys(v).map(k=>({id:k,...v[k]})):[];tryRender()});
referralSettingsRef.on('value',s=>{REFERRAL_SETTINGS=s.val()||{enabled:true};tryRender()});
let USERS=[],MILESTONES=[],REWARDS_ALL=[];
usersRef.on('value',s=>{const v=s.val();USERS=v?Object.keys(v).map(k=>({uid:k,...v[k]})):[];USERS.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));tryRender()});
milestonesRef.on('value',s=>{const v=s.val();MILESTONES=v?Object.keys(v).map(k=>({id:k,...v[k]})).sort((a,b)=>(a.ordersRequired||0)-(b.ordersRequired||0)):[];tryRender()});
rewardsRef.on('value',s=>{const v=s.val();REWARDS_ALL=v?Object.keys(v).map(k=>({id:k,...v[k]})):[];tryRender()});
categoriesRef.on('value',s=>{const v=s.val();CATEGORIES=v?Object.keys(v).map(k=>({id:k,...v[k]})):[];tryRender()});
offersRef.on('value',s=>{const v=s.val();OFFERS=v?Object.keys(v).map(k=>({id:k,...v[k]})):[];tryRender()});
var configRef=db.ref('config');var deliveryRef=db.ref('deliveryApplications');

productsRef.on('value',s=>{PRODUCTS=s.val()?Object.values(s.val()):[];PRODUCTS.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));tryRender()});
ordersRef.on('value',s=>{ORDERS=s.val()?Object.values(s.val()):[];ORDERS.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));rebuildCustomers();checkForNewOrders();tryRender()});
ratingsRef.on('value',s=>{RATINGS=s.val()?Object.values(s.val()):[];tryRender()});
configRef.on('value',s=>{
  CONFIG = s.val()||{};
  HERO_IMAGE_URL=CONFIG.heroImage||"";BANNER_TEXT=CONFIG.bannerText||"";APP_LOGO_URL=CONFIG.appLogo||"";
  if(APP_LOGO_URL){$("#admin-logo").src=APP_LOGO_URL;$("#admin-logo").style.display="block"}else{$("#admin-logo").style.display="none"}
  tryRender()});
deliveryRef.on('value',s=>{DELIVERY_APPS=s.val()?Object.values(s.val()):[];DELIVERY_APPS.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));tryRender()});

function rebuildCustomers(){
  const map={};
  for(const o of ORDERS){const k=(o.customer?.email||o.customer?.phone||"").toLowerCase();if(!k)continue;if(!map[k])map[k]={key:k,name:o.customer?.name||"",email:o.customer?.email||"",phone:o.customer?.phone||"",orders:0,total:0,last:0};map[k].orders++;map[k].total+=o.amount||0;map[k].last=Math.max(map[k].last,o.createdAt||0)}
  CUSTOMERS=Object.values(map).sort((a,b)=>b.last-a.last);
}
function tryRender(){if(IS_AUTHED)render()}

$("#admin-login-form").addEventListener("submit",e=>{
  e.preventDefault();
  if($("#adm-id").value.trim().toLowerCase()===ADMIN_ID.toLowerCase()&&$("#adm-pw").value.trim()===ADMIN_PW){
    IS_AUTHED=true;sessionStorage.setItem("sf_admin_auth","1");
    $("#admin-login").style.display="none";$("#admin-view").style.display="block";$("#admin-logout").style.display="inline-flex";render();
  }else alert("Invalid credentials.");
});
$("#admin-logout").addEventListener("click",()=>{IS_AUTHED=false;sessionStorage.removeItem("sf_admin_auth");location.reload()});
if(IS_AUTHED){$("#admin-login").style.display="none";$("#admin-view").style.display="block";$("#admin-logout").style.display="inline-flex"}
window.addEventListener("hashchange",()=>{
  const h=location.hash||"#/dashboard";
  if(_adminBackNav){_adminBackNav=false}
  else if(ADMIN_NAV_STACK[ADMIN_NAV_STACK.length-1]!==h){ADMIN_NAV_STACK.push(h)}
  render();
});

function render(){
  if(!IS_AUTHED)return;
  const h=location.hash.replace(/^#\/?/,"");const parts=h.split("/").filter(Boolean);
  const page=parts[0]||"dashboard";const sub=parts[1]||"";
  $("#admin-back").style.display=page==="dashboard"?"none":"inline-grid";
  $("#admin-home").style.display=page==="dashboard"?"none":"inline-grid";
  if(page==="dashboard")renderDashboard();
  else if(page==="settings")renderSettings();
  else if(page==="banners")renderBanners();
  else if(page==="add")renderAddProduct();
  else if(page==="categories")renderCategories();
  else if(page==="offers")renderOffers();
  else if(page==="products")renderProducts();
  else if(page==="orders"&&sub)renderOrderDetail(sub);
  else if(page==="orders")renderOrders();
  else if(page==="customers")renderCustomers();
  else if(page==="users")renderUsers();
  else if(page==="loyalty")renderLoyalty();
  else if(page==="referral")renderReferral();
  else if(page==="vendors")renderVendors();
  else if(page==="delivery"&&sub)renderDeliveryDetail(sub);
  else if(page==="delivery")renderDeliveryApps();
  else if(page==="reviews")renderReviews();
  else renderDashboard();
}

function getDeliveryStats(email){
  if(!email)return{accepted:0,pickedUp:0,delivered:0,total:0, orders:[]};
  const e=email.toLowerCase();
  const myOrders=ORDERS.filter(o=>o.deliveryBoy&&o.deliveryBoy.email&&o.deliveryBoy.email.toLowerCase()===e);
  return{
      accepted:myOrders.filter(o=>o.deliveryStatus==='Accepted').length,
      pickedUp:myOrders.filter(o=>o.deliveryStatus==='Picked Up').length,
      delivered:myOrders.filter(o=>o.deliveryStatus==='Delivered').length,
      total:myOrders.length,
      orders: myOrders
  };
}

function renderDashboard(){
  $("#admin-title").innerHTML='<i class="fa-solid fa-shield-halved" style="color:var(--accent)"></i> Dashboard';
  const totalRevenue=ORDERS.reduce((a,o)=>a+(o.amount||0),0);
  const pendingOrders=ORDERS.filter(o=>!o.status?.includes("Delivered")&&!o.status?.includes("Cancelled")).length;
  const approvedDrivers=DELIVERY_APPS.filter(a=>a.status==='Approved').length;
  
  // Store status logic
  const storeStatus = CONFIG.storeLocked ? 
      '<span style="color:#E11D48;font-weight:700"><i class="fa-solid fa-lock"></i> CLOSED</span>' : 
      '<span style="color:var(--success);font-weight:700"><i class="fa-solid fa-door-open"></i> OPEN</span>';

  $("#admin-view").innerHTML=`
    <div class="admin-card row" style="padding:12px 16px;">
       <div><strong>Store Status:</strong> ${storeStatus}</div>
       <a class="btn btn-sm btn-outline" href="#/settings">Change Settings</a>
    </div>
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-num">${PRODUCTS.length}</div><div class="stat-label">Products</div></div>
      <div class="stat-card"><div class="stat-num">${ORDERS.length}</div><div class="stat-label">Total Orders</div></div>
      <div class="stat-card"><div class="stat-num">${pendingOrders}</div><div class="stat-label">Pending</div></div>
      <div class="stat-card"><div class="stat-num">${money(totalRevenue)}</div><div class="stat-label">Revenue</div></div>
      <div class="stat-card"><div class="stat-num">${CUSTOMERS.length}</div><div class="stat-label">Customers</div></div>
      <div class="stat-card"><div class="stat-num">${approvedDrivers}/${DELIVERY_APPS.length}</div><div class="stat-label">Delivery Boys</div></div>
    </div>
    <div class="nav-grid">
      <a class="nav-card" href="#/settings"><i class="fa-solid fa-gear"></i><span>Settings & Config</span></a>

         renderSettings();
     });
  });

  // Minimum Order Rules
  $("#save-min-order").addEventListener("click", () => {
     const minProducts = parseInt($("#cfg-min-products").value) || 0;

          payout_2_5: Number($("#dp-fee-2").value),
          payout_5_10: Number($("#dp-fee-3").value)
      }).then(() => toast("Delivery Payouts Updated!"));
  });

  // Cities Setup
  $("#cfg-save-cities").addEventListener("click", () => {
     db.ref('config/allowedCities').set($("#cfg-cities").value.trim()).then(()=>toast("Cities updated!"));
  });

  // Logo Setup
  $("#logo-dz").addEventListener("click",()=>$("#logo-upload").click());

  $("#logo-save").addEventListener("click",async()=>{
    const pending=$("#logo-upload").dataset.pending;
    if(!pending&&!$("#logo-upload").files[0]){
      if(APP_LOGO_URL){toast("Logo already saved.");return}
      alert("Please select a logo image.");return;
    }
    const d=pending||await compressToDataURL($("#logo-upload").files[0],400,400,.9);
    db.ref('config/appLogo').set(d).then(()=>toast("Logo saved!")).catch(()=>alert("Failed."));
  });
  $("#logo-remove").addEventListener("click",()=>{
    if(confirm("Remove the app logo?")){
      db.ref('config/appLogo').set("").then(()=>{toast("Logo removed!");$("#logo-thumbs").innerHTML="";delete $("#logo-upload").dataset.pending}).catch(()=>alert("Failed."));
    }
  });
}

let pendingUploads=[];let editingProductId=null;
let editingOfferId=null;let pendingOfferImage='';
let editingCategoryId=null;let pendingCatImage='';
function renderOffers(offerToEdit=null){
  $("#admin-title").textContent="Offers Management";
  editingOfferId=offerToEdit?offerToEdit.id:null;
  pendingOfferImage=offerToEdit?(offerToEdit.imageUrl||''):'';
  const catOptions=CATEGORIES.map(c=>`<option value="${escapeHtml(c.name)}" ${offerToEdit&&offerToEdit.category===c.name?'selected':''}>${escapeHtml(c.name)}</option>`).join('');

  const rows=OFFERS.map(o=>`
    <div class="admin-card" style="display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:8px">
      <img src="${o.imageUrl||''}" style="width:56px;height:56px;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:#f3f3f3">
      <div style="flex:1">
        <div style="font-weight:700">${escapeHtml(o.title||'')}</div>
        <div class="muted" style="font-size:12px">${escapeHtml(o.discount||'')} ${o.category?'&middot; '+escapeHtml(o.category):''} ${o.code?'&middot; Code: <strong>'+escapeHtml(o.code)+'</strong>':''}</div>
        <div class="chip" style="font-size:11px;margin-top:4px;background:${o.active===false?'#FEE2E2':'var(--accentLight)'};border:none;display:inline-block">${o.active===false?'Inactive':'Active'}</div>
      </div>
      <button class="btn btn-sm btn-outline" data-edit-offer="${o.id}"><i class="fa-solid fa-pen"></i></button>
      <button class="btn btn-sm btn-danger" data-del-offer="${o.id}"><i class="fa-solid fa-trash"></i></button>
    </div>`).join("");

  $("#admin-view").innerHTML=`
    <div class="admin-card">
      <h3 style="margin:0 0 10px;font-family:Poppins;color:var(--accentDark)">${editingOfferId?'Edit Offer':'Add New Offer'}</h3>
      <label>Offer Title *</label><input id="of-title" value="${escapeHtml(offerToEdit?.title||'')}" placeholder="e.g. Flat 50% OFF">
      <label>Description</label><input id="of-desc" value="${escapeHtml(offerToEdit?.description||'')}" placeholder="e.g. On all Pizza orders above \u20b9199">
      <label>Discount Tag</label><input id="of-discount" value="${escapeHtml(offerToEdit?.discount||'')}" placeholder="e.g. 50% OFF">
      <label>Link to Category (optional)</label>
      <select id="of-category" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font-family:inherit;font-size:14px">
        <option value="">-- None --</option>
        ${catOptions}
      </select>
      <label style="margin-top:12px">Offer Banner Image</label>
      <div class="dropzone" id="of-dz"><i class="fa-solid fa-cloud-arrow-up" style="font-size:24px"></i><div style="font-weight:700;margin-top:6px">Click to upload</div></div>
      <input id="of-upload" type="file" accept="image/*" style="display:none">
      <div class="thumbs" id="of-thumbs">${pendingOfferImage?`<div class="thumb"><img src="${pendingOfferImage}"></div>`:''}</div>
      <label style="margin-top:12px">Coupon / Redeem Code (optional)</label><input id="of-code" value="${escapeHtml(offerToEdit?.code||'')}" placeholder="e.g. SAVE50" style="text-transform:uppercase">
      <div class="row" style="gap:10px"><div style="flex:1"><label>Offer Start Date</label><input id="of-start" type="date" value="${offerToEdit?.startDate||''}"></div><div style="flex:1"><label>Offer End Date</label><input id="of-end" type="date" value="${offerToEdit?.endDate||''}"></div></div>
      <label style="margin-top:12px">Discount Type</label>
      <select id="of-disc-type">
        <option value="fixed" ${offerToEdit?.discountType==='fixed'?'selected':''}>Fixed Discount</option>
        <option value="percentage" ${offerToEdit?.discountType==='percentage'?'selected':''}>Percentage Discount</option>
        <option value="free_delivery" ${offerToEdit?.discountType==='free_delivery'?'selected':''}>Free Delivery</option>
        <option value="free_product" ${offerToEdit?.discountType==='free_product'?'selected':''}>Free Product</option>
        <option value="bogo" ${offerToEdit?.discountType==='bogo'?'selected':''}>Buy X Get Y</option>
      </select>
      <div class="row" style="gap:10px"><div style="flex:1"><label>Discount Value (\u20b9 or %)</label><input id="of-disc-value" type="number" min="0" value="${offerToEdit?.discountValue||''}"></div><div style="flex:1"><label>Max Discount Cap (\u20b9)</label><input id="of-max-discount" type="number" min="0" value="${offerToEdit?.maxDiscount||''}"></div></div>
      <div id="of-free-product-wrap" style="display:none">
        <label>Free Product <span class="muted" style="font-weight:400">(exact product that becomes free)</span></label>
        <select id="of-free-product"><option value="">-- Select Product --</option>${PRODUCTS.map(p=>`<option value="${p.id}" ${offerToEdit?.freeProductId===p.id?'selected':''}>${escapeHtml(p.name)}</option>`).join('')}</select>
      </div>
      <div class="row" style="gap:10px"><div style="flex:1"><label>Minimum Order Amount</label><input id="of-min-order" type="number" min="0" value="${offerToEdit?.minOrderAmount||0}"></div></div>
      <div class="row" style="gap:10px"><div style="flex:1"><label>Max Total Redemptions</label><input id="of-max-redeem" type="number" min="0" value="${offerToEdit?.maxRedemptions||0}" placeholder="0 = unlimited"></div><div style="flex:1"><label>Per-User Redemption Limit</label><input id="of-per-user-limit" type="number" min="0" value="${offerToEdit?.perUserLimit||1}"></div></div>
      <label style="margin-top:12px;display:flex;align-items:center;gap:8px"><input type="checkbox" id="of-active" ${!offerToEdit||offerToEdit.active!==false?'checked':''} style="width:auto"> Active (visible to customers)</label>
      <div style="margin-top:16px;display:flex;gap:10px">
        <button class="btn btn-block" id="of-save"><i class="fa-solid fa-save"></i> ${editingOfferId?'Update Offer':'Save Offer'}</button>
        ${editingOfferId?`<button class="btn btn-outline" id="of-cancel">Cancel</button>`:''}
      </div>
    </div>
    <h4 style="margin:20px 4px 8px;color:var(--accentDark)">All Offers (${OFFERS.length})</h4>
    ${rows||'<div class="muted" style="padding:12px">No offers yet. Add one above.</div>'}
  `;

  $("#of-dz").addEventListener("click",()=>$("#of-upload").click());
  $("#of-upload").addEventListener("change",async e=>{
    const f=e.target.files[0];if(!f)return;
    pendingOfferImage=await compressToDataURL(f,600,340,.85);
    $("#of-thumbs").innerHTML=`<div class="thumb"><img src="${pendingOfferImage}"></div>`;
  });
  const toggleFreeProductField=()=>{
    const t=$("#of-disc-type").value;
    $("#of-free-product-wrap").style.display=(t==='free_product'||t==='bogo')?'block':'none';
  };
  $("#of-disc-type").addEventListener("change",toggleFreeProductField);
  toggleFreeProductField();
  $("#of-save").addEventListener("click",()=>{
    const title=$("#of-title").value.trim();
    if(!title){alert("Please enter an offer title.");return}
    const discountType=$("#of-disc-type").value;
    const data={
      title,
      description:$("#of-desc").value.trim(),
      discount:$("#of-discount").value.trim(),
      category:$("#of-category").value,
      imageUrl:pendingOfferImage||'',
      code:$("#of-code").value.trim().toUpperCase(),
      startDate:$("#of-start").value,
      endDate:$("#of-end").value,
      discountType,
      discountValue:parseFloat($("#of-disc-value").value)||0,
      maxDiscount:parseFloat($("#of-max-discount").value)||0,
      freeProductId:(discountType==='free_product'||discountType==='bogo')?($("#of-free-product").value||''):'',
      minOrderAmount:parseFloat($("#of-min-order").value)||0,
      maxRedemptions:parseInt($("#of-max-redeem").value)||0,
      perUserLimit:parseInt($("#of-per-user-limit").value)||1,
      active:$("#of-active").checked
    };
    if(editingOfferId){
      db.ref('offers/'+editingOfferId).update(data).then(()=>{toast("Offer updated!");editingOfferId=null;pendingOfferImage=''});
    }else{
      const k=db.ref('offers').push().key;
      db.ref('offers/'+k).set(data).then(()=>{toast("Offer added!");pendingOfferImage='';});
    }
  });
  $("#of-cancel")?.addEventListener("click",()=>{editingOfferId=null;pendingOfferImage='';renderOffers()});
  $$("[data-edit-offer]").forEach(b=>b.addEventListener("click",()=>{const o=OFFERS.find(x=>x.id===b.dataset.editOffer);renderOffers(o)}));
  $$("[data-del-offer]").forEach(b=>b.addEventListener("click",()=>{if(confirm("Delete this offer?"))db.ref('offers/'+b.dataset.delOffer).remove().then(()=>toast("Deleted"))}));
}

function renderThumbs(){const t=$("#pf-thumbs");if(t)t.innerHTML=pendingUploads.map(u=>`<div class="thumb"><img src="${u}"></div>`).join("")}

function saveProduct(){
  const name=$("#pf-name").value.trim();const desc=$("#pf-desc").value.trim();const cat=$("#pf-category").value.trim();
  let mrp=Number($("#pf-mrp").value||0);let disc=Number($("#pf-disc").value||0);let price=Number($("#pf-price").value||0);
  
  let shipStr = $("#pf-shipping").value;
  const ship = shipStr === '' ? 50 : Number(shipStr);

  const outOfStock = $("#pf-out-of-stock").checked;
  const isVeg = $("#pf-nonveg").checked ? false : true;
  
  // Gather City-Wise Pricing
  const cityPricing = {};
  $$(".city-pricing-row").forEach(row => {
      const c = row.dataset.cityName;
      let cmrp = Number(row.querySelector('.c-mrp').value || 0);
      let cdisc = Number(row.querySelector('.c-disc').value || 0);
      let cprice = Number(row.querySelector('.c-price').value || 0);
      
      if(!cprice && cmrp && cdisc) cprice = Math.round(cmrp*(100-cdisc)/100);
      if(!cmrp && cprice && cdisc) cmrp = Math.round(cprice*100/(100-cdisc));
      if(!cdisc && cmrp && cprice) cdisc = Math.max(0, Math.min(99, Math.round((cmrp-cprice)/cmrp*100)));
      
      if (cprice || cmrp) {
          cityPricing[c] = { mrp: cmrp, disc: cdisc, price: cprice };
      }
  });

  if(!price&&mrp&&disc)price=Math.round(mrp*(100-disc)/100);
  if(!mrp&&price&&disc)mrp=Math.round(price*100/(100-disc));
  if(!disc&&mrp&&price)disc=Math.max(0,Math.min(99,Math.round((mrp-price)/mrp*100)));
  
  if(!name||!price||!cat){alert("Please fill Name, Category, and Default Sale Price.");return}
  if(!pendingUploads.length){alert("Upload at least one image.");return}

  const prepTimeMinutes=Number($("#pf-preptime").value)||0;
  const vendorUid=$("#pf-vendor").value||null;
  const vendorEarnings=vendorUid?Number($("#pf-vendor-earnings").value)||0:undefined;

  const data={
      name, description:desc, category:cat, 
      priceMrp:mrp, discountPercent:disc, price, 
      shipping:ship, imageUrls:pendingUploads.slice(), 
      createdAt:Date.now(), outOfStock, cityPricing, isVeg, prepTimeMinutes, vendorUid, vendorEarnings
  };

  if(editingProductId){
      const p=PRODUCTS.find(x=>x.id===editingProductId);
      if(p?.firebaseKey){
          db.ref('products/'+p.firebaseKey).update(data).then(()=>{toast("Product Updated!");editingProductId=null;pendingUploads=[];routeTo("#/products")}).catch(err=>alert("Failed to update product"));
      }
  } else {
      const k=db.ref('products').push().key;
      db.ref('products/'+k).set({...data,id:uid(),firebaseKey:k}).then(()=>{toast("Product Saved!");pendingUploads=[];renderAddProduct()}).catch(err=>alert("Failed to save product"));
  }
}

const ORDER_STAGES=["New Order","Accepted","Preparing","Ready for Pickup","Picked Up","On the Way","Delivered"];
function haversineKm(lat1,lng1,lat2,lng2){
  const R=6371;
  const dLat=(lat2-lat1)*Math.PI/180;
  const dLng=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function estimateEtaMinutes(km){return Math.max(1,Math.round((km/25)*60))}
function stageIndex(s){const i=ORDER_STAGES.indexOf(s);return i===-1?0:i}
function delStatusClass(s){

    case "Picked Up":return"picked";
    case "On the Way":return"ontheway";
    case "Delivered":return"delivered";
    default:return"unassigned";
  }
}

/* ===== Ringtone (Web Audio, no external asset needed) ===== */
let _ringCtx=null,_ringInterval=null;
function startRingtone(){
  if(_ringInterval)return;
  try{
    _ringCtx=_ringCtx||new (window.AudioContext||window.webkitAudioContext)();
    const beep=()=>{
      if(!_ringCtx)return;
      const o1=_ringCtx.createOscillator(),g1=_ringCtx.createGain();
      o1.type="sine";o1.frequency.value=740;
      g1.gain.setValueAtTime(0,_ringCtx.currentTime);
      g1.gain.linearRampToValueAtTime(.3,_ringCtx.currentTime+.02);
      g1.gain.linearRampToValueAtTime(0,_ringCtx.currentTime+.4);
      o1.connect(g1);g1.connect(_ringCtx.destination);
      o1.start();o1.stop(_ringCtx.currentTime+.45);
    };
    beep();
    _ringInterval=setInterval(beep,650);
  }catch(e){console.warn("Ringtone unavailable:",e)}
}
function stopRingtone(){
  if(_ringInterval){clearInterval(_ringInterval);_ringInterval=null}
}

function userCompletedOrders(u){
  const resetAt=u.loyaltyResetAt||0;
  return ORDERS.filter(o=>{
    const mine=o.uid===u.uid||((o.customer?.email||'').toLowerCase()===((u.email||'').toLowerCase())&&u.email);
    return mine&&isOrderCompleted(o)&&(!resetAt||(o.createdAt||0)>resetAt);
  }).length;
}
function userRewards(u){return REWARDS_ALL.filter(r=>r.uid===u.uid)}
function userMilestoneInfo(u){
  const completed=userCompletedOrders(u);
  let target=null;
  MILESTONES.filter(m=>m.active!==false).forEach(m=>{
    if(m.repeatable){
      const remaining=completed%m.ordersRequired===0?m.ordersRequired:m.ordersRequired-(completed%m.ordersRequired);
      if(!target||remaining<target.remaining)target={milestone:m,remaining};
    }else if(completed<m.ordersRequired){
      const remaining=m.ordersRequired-completed;
      if(!target||remaining<target.remaining)target={milestone:m,remaining};
    }
  });
  return{completed,next:target};
}

    ${monthKeys.map(k=>`<tr><td>${k}</td><td>${monthly[k].issued}</td><td>${monthly[k].redeemed}</td></tr>`).join('')}
  </tbody></table>`}
  </div>

/* -- Dashboard / Analytics -- */
function referralDashboardHtml(){

  const pending=REFERRALS_ALL.filter(r=>r.status==='pending').length;
  const completed=REFERRALS_ALL.filter(r=>r.status==='completed').length;

function removeCampTask(i){CAMPAIGN_TASKS_DRAFT.splice(i,1);renderCampTasksList()}
function wireCampaignForm(){
  CAMPAIGN_TASKS_DRAFT=[];
  renderCampTasksList();
  $("#camp-task-add").addEventListener("click",()=>{
    const type=$("#camp-task-type").value;const val=parseFloat($("#camp-task-value").value);
    if(!val||val<=0){alert("Enter a valid task value.");return}
    CAMPAIGN_TASKS_DRAFT.push({type,targetValue:val});
    $("#camp-task-value").value="";
    renderCampTasksList();
  });
  $("#camp-save").addEventListener("click",saveCampaign);

function resetCampaignForm(){
  CAMPAIGN_TASKS_DRAFT=[];
  $("#camp-edit-id").value="";$("#camp-name").value="";renderCampTasksList();
  $("#camp-rr-type").value="coupon";$("#camp-rr-value").value="";$("#camp-rr-expiry").value="30";
  $("#camp-rd-type").value="coupon";$("#camp-rd-value").value="";$("#camp-rd-expiry").value="30";
  $("#camp-active").checked=true;
  $("#camp-form-title").textContent="Create Campaign";$("#camp-cancel").style.display="none";
}
function editCampaign(id){
  const c=REFERRAL_CAMPAIGNS.find(x=>x.id===id);if(!c)return;
  REFERRAL_TAB='campaigns';renderReferral();
  CAMPAIGN_TASKS_DRAFT=(c.tasks||[]).slice();renderCampTasksList();
  $("#camp-edit-id").value=id;$("#camp-name").value=c.name||"";
  $("#camp-rr-type").value=c.referrerReward?.type||"coupon";$("#camp-rr-value").value=c.referrerReward?.value||"";$("#camp-rr-expiry").value=c.referrerReward?.expiryDays||0;
  $("#camp-rd-type").value=c.referredReward?.type||"coupon";$("#camp-rd-value").value=c.referredReward?.value||"";$("#camp-rd-expiry").value=c.referredReward?.expiryDays||0;
  $("#camp-active").checked=c.active!==false;
  $("#camp-form-title").textContent="Edit Campaign";$("#camp-cancel").style.display="inline-flex";
  window.scrollTo(0,0);
}
function saveCampaign(){
  const id=$("#camp-edit-id").value;
  const name=$("#camp-name").value.trim();
  if(!name){alert("Enter a campaign name.");return}
  if(CAMPAIGN_TASKS_DRAFT.length===0){alert("Add at least one task.");return}
  const data={
    name,tasks:CAMPAIGN_TASKS_DRAFT.slice(),
    referrerReward:{type:$("#camp-rr-type").value,value:parseFloat($("#camp-rr-value").value)||0,expiryDays:parseInt($("#camp-rr-expiry").value)||0,name:name+" — Referrer Reward"},
    referredReward:{type:$("#camp-rd-type").value,value:parseFloat($("#camp-rd-value").value)||0,expiryDays:parseInt($("#camp-rd-expiry").value)||0,name:name+" — Welcome Reward"},
    active:$("#camp-active").checked,updatedAt:Date.now()
  };
  if(id){referralCampaignsRef.child(id).update(data).then(()=>{toast("Campaign updated!");resetCampaignForm()}).catch(err=>alert("Failed to update campaign"));}
  else{data.createdAt=Date.now();referralCampaignsRef.push(data).then(()=>{toast("Campaign created!");resetCampaignForm()}).catch(err=>alert("Failed to create campaign"));}
}
function toggleCampaignActive(id,current){referralCampaignsRef.child(id).update({active:!current}).then(()=>toast(current?"Campaign disabled":"Campaign enabled")).catch(err=>alert("Failed to toggle campaign"));}
function deleteCampaign(id){if(!confirm("Delete this campaign? Existing referral records won't be affected."))return;referralCampaignsRef.child(id).remove().then(()=>toast("Campaign deleted")).catch(err=>alert("Failed to delete campaign"));}

/* -- Applications -- */
const vendorStatusChip=s=>{
  const map={pending_payment:['#FFF7E6','#D97706','Pending Payment'],pending_approval:['#FFF7E6','#D97706','Pending Approval'],Approved:['#E6F7EE','#18A957','Approved'],rejected:['#FEE2E2','#E11D48','Rejected'],suspended:['#FEE2E2','#E11D48','Suspended'],blocked:['#FEE2E2','#E11D48','Blocked']};
  const[bg,color,label]=map[s]||['#F3F4F6','#6B7280',s||'Unknown'];
  return `<span class="chip" style="background:${bg};color:${color}">${label}</span>`;
};
function vendorApplicationsHtml(q=""){
  const term=q.trim().toLowerCase();
  const list=term?VENDORS_ALL.filter(v=>(v.restaurantName||'').toLowerCase().includes(term)||(v.ownerName||'').toLowerCase().includes(term)||(v.email||'').toLowerCase().includes(term)):VENDORS_ALL;
  return `<div class="admin-card"><input id="vend-search" placeholder="Search by restaurant, owner, or email..." value="${escapeHtml(q)}"></div>
  <div id="vend-list">${vendorApplicationsListHtml(list)}</div>`;
}
function vendorAvailabilityChip(v){
  const s=v.availabilityStatus||(v.online?'Live':'Offline');
  const map={Live:['#E6F7EE','#18A957'],Offline:['#F3F4F6','#6B7280'],Busy:['#FFF7E6','#D97706'],Closed:['#FEE2E2','#E11D48']};
  const[bg,color]=map[s]||map.Offline;
  return `<span class="chip" style="background:${bg};color:${color}">${s}</span>`;
}
function vendorEarningsSummary(uid){
  const linkedProductIds=new Set(PRODUCTS.filter(p=>p.vendorUid===uid).map(p=>p.id));
  const relevantOrders=ORDERS.filter(o=>isOrderCompleted(o)&&o.items&&o.items.some(it=>linkedProductIds.has(it.productId)));
  let totalSales=0,vendorEarnings=0,platformProfit=0,orderCount=0;
  relevantOrders.forEach(o=>{
    let touched=false;
    o.items.forEach(it=>{
      if(!linkedProductIds.has(it.productId))return;
      touched=true;
      const p=PRODUCTS.find(x=>x.id===it.productId);
      const earning=(p&&p.vendorEarnings!==undefined)?p.vendorEarnings:0;
      const sell=it.price||0;
      totalSales+=sell*it.qty;
      vendorEarnings+=earning*it.qty;
      platformProfit+=(sell-earning)*it.qty;
    });
    if(touched)orderCount++;
  });
  return{totalSales,vendorEarnings,platformProfit,orderCount};
}
function vendorApplicationsListHtml(list){
  if(list.length===0)return '<div class="admin-card muted">No vendor applications yet.</div>';
  return list.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).map(v=>`
    <div class="admin-card">
      <div class="row">
        <div style="display:flex;align-items:center;gap:10px">
          ${v.logoUrl?`<img src="${v.logoUrl}" style="width:44px;height:44px;border-radius:10px;object-fit:cover">`:`<div style="width:44px;height:44px;border-radius:10px;background:var(--accentLight);display:grid;place-items:center;color:var(--accent)"><i class="fa-solid fa-store"></i></div>`}
          <div><strong style="color:var(--accentDark)">${escapeHtml(v.restaurantName||'—')}</strong><div class="muted" style="font-size:12px">${escapeHtml(v.ownerName||'')} · ${escapeHtml(v.mobile||'')}</div></div>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">${vendorStatusChip(v.status)}${v.status==='Approved'?vendorAvailabilityChip(v):''}</div>
      </div>
      <div class="muted" style="font-size:12px;margin-top:8px">${escapeHtml(v.address||'')} · ${escapeHtml(v.category||'')}</div>
      <div class="muted" style="font-size:12px">Email: ${escapeHtml(v.email||'')} · FSSAI: ${escapeHtml(v.fssai||'—')} · GST: ${escapeHtml(v.gst||'—')}</div>
      <div class="muted" style="font-size:12px">Plan: ${escapeHtml(v.planName||'—')} · Bank: ${escapeHtml(v.bankAccount||'—')} · UPI: ${escapeHtml(v.upiId||'—')}</div>
      ${v.imageUrls&&v.imageUrls.length?`<div style="display:flex;gap:6px;margin-top:8px;overflow-x:auto">${v.imageUrls.map(u=>`<img src="${u}" style="width:60px;height:60px;border-radius:8px;object-fit:cover;flex-shrink:0">`).join('')}</div>`:''}
      ${v.status==='Approved'?(()=>{
        const e=vendorEarningsSummary(v.uid);
        const paidTotal=v.settledAmount||0;
        const pending=Math.max(0,e.vendorEarnings-paidTotal);
        return `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px">
          <div style="text-align:center;background:var(--accentLight);border-radius:8px;padding:6px"><div style="font-weight:700;font-size:13px;color:var(--accentDark)">${money(e.totalSales)}</div><div class="muted" style="font-size:10px">Total Sales</div></div>
          <div style="text-align:center;background:#FFF7E6;border-radius:8px;padding:6px"><div style="font-weight:700;font-size:13px;color:#D97706">${money(pending)}</div><div class="muted" style="font-size:10px">Pending Settlement</div></div>
          <div style="text-align:center;background:#E6F7EE;border-radius:8px;padding:6px"><div style="font-weight:700;font-size:13px;color:var(--success)">${money(e.platformProfit)}</div><div class="muted" style="font-size:10px">Platform Profit</div></div>
        </div>
        ${pending>0?`<button class="btn btn-sm btn-success" style="margin-top:8px" onclick="markVendorSettled('${v.uid}',${e.vendorEarnings})">Mark ${money(pending)} as Paid</button>`:''}`;
      })():''}
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">
        ${v.status==='pending_approval'?`<button class="btn btn-sm btn-success" onclick="setVendorStatus('${v.uid}','Approved')">Approve</button><button class="btn btn-sm btn-danger" onclick="setVendorStatus('${v.uid}','rejected')">Reject</button>`:''}
        ${v.status==='Approved'?`<button class="btn btn-sm btn-outline" onclick="setVendorStatus('${v.uid}','suspended')">Suspend</button><button class="btn btn-sm btn-danger" onclick="setVendorStatus('${v.uid}','blocked')">Block</button>`:''}

function setVendorStatus(uid,status){
  const updates={status};
  if(status==='Approved')updates.approvedAt=Date.now();
  vendorsRef.child(uid).update(updates).then(()=>toast("Vendor status updated: "+status)).catch(()=>alert("Failed."));
}
function markVendorSettled(uid,totalEarnings){
  vendorsRef.child(uid).update({settledAmount:totalEarnings,lastSettlementAt:Date.now()}).then(()=>toast("Settlement recorded")).catch(()=>alert("Failed."));
}
function deleteVendor(uid){
  const v=VENDORS_ALL.find(x=>x.uid===uid);if(!v)return;
  if(!confirm(`Delete "${v.restaurantName}"? This removes the vendor account and unlinks/deletes their products. Other vendors are not affected. This cannot be undone.`))return;
  const linkedProducts=PRODUCTS.filter(p=>p.vendorUid===uid);
  const deleteProductPromises=linkedProducts.map(p=>db.ref('products/'+p.firebaseKey).remove());
  Promise.all(deleteProductPromises).then(()=>vendorsRef.child(uid).remove()).then(()=>toast("Vendor and their products deleted")).catch(()=>alert("Failed to delete vendor completely — please retry."));
}

function wireVendorPlansForm(){
  $("#vp-save").addEventListener("click",saveVendorPlan);
  $("#vp-cancel").addEventListener("click",resetVendorPlanForm);
}
function resetVendorPlanForm(){
  $("#vp-edit-id").value="";$("#vp-name").value="";$("#vp-duration").value="";$("#vp-trial").value="0";$("#vp-price").value="";$("#vp-active").checked=true;
  $("#vp-form-title").textContent="Add Plan";$("#vp-cancel").style.display="none";
}
function editVendorPlan(id){
  const p=VENDOR_PLANS.find(x=>x.id===id);if(!p)return;
  VENDOR_TAB='plans';renderVendors();
  $("#vp-edit-id").value=id;$("#vp-name").value=p.name;$("#vp-duration").value=p.durationDays;$("#vp-trial").value=p.trialDays||0;$("#vp-price").value=p.price;$("#vp-active").checked=p.active!==false;
  $("#vp-form-title").textContent="Edit Plan";$("#vp-cancel").style.display="inline-flex";
}
function saveVendorPlan(){
  const id=$("#vp-edit-id").value;
  const name=$("#vp-name").value.trim();const durationDays=parseInt($("#vp-duration").value);const trialDays=parseInt($("#vp-trial").value)||0;const price=parseFloat($("#vp-price").value)||0;const active=$("#vp-active").checked;
  if(!name||!durationDays){alert("Enter plan name and duration.");return}
  const data={name,durationDays,trialDays,price,active,updatedAt:Date.now()};
  if(id){vendorPlansRef.child(id).update(data).then(()=>{toast("Plan updated!");resetVendorPlanForm()}).catch(err=>alert("Failed to update plan"));}
  else{data.createdAt=Date.now();vendorPlansRef.push(data).then(()=>{toast("Plan created!");resetVendorPlanForm()}).catch(err=>alert("Failed to create plan"));}
}
function toggleVendorPlan(id,current){vendorPlansRef.child(id).update({active:!current}).then(()=>toast(current?"Plan disabled":"Plan enabled")).catch(err=>alert("Failed to toggle plan"));}
function deleteVendorPlan(id){if(!confirm("Delete this plan?"))return;vendorPlansRef.child(id).remove().then(()=>toast("Plan deleted")).catch(err=>alert("Failed to delete plan"));}

function renderDeliveryDetail(email){
  const decodedEmail=decodeURIComponent(email);
  const app=DELIVERY_APPS.find(a=>a.email&&a.email.toLowerCase()===decodedEmail.toLowerCase());
  if(!app){renderDeliveryApps();return}
  $("#admin-title").textContent=app.name+"'s Earnings";
  
  const stats=getDeliveryStats(decodedEmail);
  const myOrders = stats.orders;
  
  const now = new Date();
  const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  const startOfWeek = startOfDay - (now.getDay() * 86400000);
  const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1).getTime();

  let todayEarning = 0, weekEarning = 0, monthEarning = 0, totalEarning = 0;
  let todayOrders = 0, weekOrders = 0, monthOrders = 0;

  myOrders.filter(o=>o.deliveryStatus==='Delivered').forEach(o => {
      const payout = o.deliveryPayout !== undefined ? o.deliveryPayout : (o.items ? o.items.reduce((s, it) => s + (typeof it.shipping === 'number' ? it.shipping : 50), 0) : 50);
      
      totalEarning += payout;
      if (o.createdAt >= startOfDay) { todayEarning += payout; todayOrders++; }
      if (o.createdAt >= startOfWeek) { weekEarning += payout; weekOrders++; }
      if (o.createdAt >= startOfMonth) { monthEarning += payout; monthOrders++; }
  });

  const delStatusClass=s=>{if(s==='Delivered')return'delivered';if(s==='Picked Up')return'picked';if(s==='Accepted')return'accepted';return'unassigned'};
  
  $("#admin-view").innerHTML=`
    <div class="admin-card">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
        <div style="width:56px;height:56px;border-radius:999px;background:var(--accentLight);display:grid;place-items:center"><i class="fa-solid fa-motorcycle" style="font-size:24px;color:var(--accent)"></i></div>
        <div><div style="font-weight:700;font-size:18px;color:var(--accentDark)">${escapeHtml(app.name)}</div><div class="muted">${escapeHtml(app.email)} | ${escapeHtml(app.phone)}</div><div class="muted" style="font-size:12px">Zone: ${escapeHtml(app.deliveryFrom||'')} to ${escapeHtml(app.deliveryTo||'')}</div></div>
      </div>
      
      <h4 style="margin:0 0 10px;font-family:Poppins;color:var(--accentDark)">Earnings Dashboard</h4>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px">
        <div class="earning-box"><div class="amt">${money(todayEarning)}</div><div class="lbl">Today</div></div>
        <div class="earning-box"><div class="amt">${money(weekEarning)}</div><div class="lbl">This Week</div></div>
        <div class="earning-box"><div class="amt">${money(monthEarning)}</div><div class="lbl">This Month</div></div>
        <div class="earning-box" style="background:#E6F7EE; border-color:var(--success);"><div class="amt" style="color:var(--success)">${money(totalEarning)}</div><div class="lbl">Total Payout</div></div>
      </div>

      <h4 style="margin:0 0 10px;font-family:Poppins;color:var(--accentDark)">Delivered Orders Dashboard</h4>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px">
        <div class="earning-box" style="background:#F0FDF4; border-color:#86EFAC;"><div class="amt" style="color:#166534">${todayOrders}</div><div class="lbl">Orders Today</div></div>
        <div class="earning-box" style="background:#F0FDF4; border-color:#86EFAC;"><div class="amt" style="color:#166534">${weekOrders}</div><div class="lbl">Orders This Week</div></div>
        <div class="earning-box" style="background:#F0FDF4; border-color:#86EFAC;"><div class="amt" style="color:#166534">${monthOrders}</div><div class="lbl">Orders This Month</div></div>

      </div>

      ${myOrders.length===0?'<div class="muted">No orders accepted yet.</div>':myOrders.map(o=>`

    </div>`;
}

async function compressToDataURL(file,maxW=1200,maxH=1200,quality=.85){const img=await fileToImage(file);const[w,h]=fitRect(img.naturalWidth,img.naturalHeight,maxW,maxH);const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);return c.toDataURL("image/jpeg",quality)}
function fitRect(w,h,mW,mH){const r=Math.min(mW/w,mH/h,1);return[Math.round(w*r),Math.round(h*r)]}
function fileToImage(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>res(img);img.onerror=rej;img.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}

render();
</script>
